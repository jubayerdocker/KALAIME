name: Dependency security

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-scan:
    name: SPDX SBOM and Grype / Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config python3
          scripts/install-llvm-23-ubuntu.sh
          scripts/install-linux-build-tools.sh

      - name: Install SBOM and vulnerability tools
        shell: bash
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://get.anchore.io/syft | sh -s -- -b "$HOME/.local/bin"
          curl -sSfL https://get.anchore.io/grype | sh -s -- -b "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Resolve manifest dependencies
        run: cmake --preset ubuntu-ci

      - name: Generate SPDX SBOM and scan with Grype
        run: scripts/security-scan-ubuntu.sh build/ubuntu-ci

      - name: Upload SBOM and scan report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dependency-sbom-and-grype-report
          path: |
            build/ubuntu-ci/spdx/*.spdx.json
            build/ubuntu-ci/grype-report.txt
          if-no-files-found: warn
          retention-days: 30
