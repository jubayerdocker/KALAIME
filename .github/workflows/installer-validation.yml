name: Installer Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: installer-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inno-setup-installer:
    name: Inno Setup Installer / Windows 2022 / x64
    runs-on: windows-2022
    env:
      VCPKG_ROOT: ${{ github.workspace }}\.vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install Inno Setup
        shell: pwsh
        continue-on-error: true
        run: |
          $innoSetupUrl = "https://github.com/jrsoftware/issrc/releases/download/6.2.2/is-6.2.2.exe"
          $innoSetupInstaller = Join-Path $env:TEMP 'inno-setup.exe'
          try {
            Invoke-WebRequest -Uri $innoSetupUrl -OutFile $innoSetupInstaller -TimeoutSec 60
            $proc = Start-Process -FilePath $innoSetupInstaller -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-' -Wait -PassThru
            if ($proc.ExitCode -eq 0) {
              Write-Host "Inno Setup installed."
            } else {
              Write-Host "Inno Setup installation failed with exit code $($proc.ExitCode)."
            }
          } catch {
            Write-Host "Inno Setup download failed: $($_.Exception.Message)"
          }

      - name: Verify Inno Setup installation
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = Get-ChildItem -Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
          if ($iscc) {
            Write-Host "Inno Setup compiler: $($iscc.FullName)"
            & $iscc /?
          } else {
            Write-Host "Inno Setup not found; installer build will be skipped."
          }

      - name: Build Windows release targets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$env:VCPKG_ROOT"
          git -C "$env:VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$env:VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) { throw "vcpkg bootstrap failed." }
          cmake --preset windows-msvc
          cmake --build --preset windows-msvc-release --parallel 1 -- /verbosity:minimal
          if ($LASTEXITCODE -ne 0) { throw "Release build failed." }

      - name: Verify build artifacts exist
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $required = @(
            "build/windows-msvc/Release/suborno_windows_tsf.dll"
          )
          foreach ($f in $required) {
            if (-not (Test-Path $f)) { throw "Required build artifact missing: $f" }
            Write-Host "Found: $f"
          }

      - name: Build installer with Inno Setup
        shell: pwsh
        continue-on-error: true
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "ISCC.exe not found; skipping installer build."
            exit 0
          }
          & $iscc /Q installer/windows/suborno_installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed." }

      - name: Verify installer output
        shell: pwsh
        continue-on-error: true
        run: |
          $installer = Get-ChildItem -Path "installer/windows/Output/*.exe" -ErrorAction SilentlyContinue
          if ($installer) {
            Write-Host "Installer: $($installer.FullName)"
            Write-Host "Installer size: $($installer.Length) bytes"
            if ($installer.Length -lt 100KB) { throw "Installer seems too small." }
          } else {
            Write-Host "No installer output found; Inno Setup may not be available."
          }

      - name: Upload installer artifact
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: suborno-installer
          path: installer/windows/Output/*.exe
          if-no-files-found: ignore
          retention-days: 14
