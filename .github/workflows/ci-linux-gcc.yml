name: CI Linux GCC

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-linux-gcc-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gcc-build-test:
    name: GCC 13 Build & Test / Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config python3
          scripts/install-linux-build-tools.sh
          g++-13 --version | head -1
          cmake --version | head -1
          ninja --version

      - name: Install pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure (GCC 13)
        run: cmake --preset ubuntu-gcc-ci

      - name: Verify GCC compiler selection
        run: |
          python3 - <<'PY'
          import json, pathlib, shlex, shutil, subprocess
          expected = pathlib.Path(shutil.which("g++-13")).resolve(strict=True)
          cache = pathlib.Path("build/ubuntu-gcc-ci/CMakeCache.txt").read_text()
          entry = next(l for l in cache.splitlines() if l.startswith("CMAKE_CXX_COMPILER:") and "=" in l)
          name = entry.split("=", 1)[1]
          p = pathlib.Path(name)
          if not p.is_absolute():
              name = shutil.which(name)
              assert name, "CMake compiler not on PATH"
              p = pathlib.Path(name)
          assert p.resolve(strict=True) == expected, f"CMake selected {p}, expected {expected}"
          ver = subprocess.check_output([str(expected), "-dumpfullversion"], text=True).strip()
          assert ver == "13.3.0", f"Unexpected GCC version: {ver}"
          cmds = json.loads(pathlib.Path("build/ubuntu-gcc-ci/compile_commands.json").read_text())
          assert cmds, "compile_commands.json is empty"
          for entry in cmds:
              argv = entry.get("arguments") or shlex.split(entry["command"])
              c = pathlib.Path(argv[0])
              if not c.is_absolute():
                  c = pathlib.Path(shutil.which(argv[0]))
                  assert c, f"Compile command compiler not on PATH: {argv[0]}"
              assert c.resolve(strict=True) == expected, f"Compile command uses {c}, expected {expected}"
          PY

      - name: Build (GCC 13)
        run: cmake --build --preset ubuntu-gcc-ci --parallel 1

      - name: Run CUnit Tests (GCC 13)
        run: ctest --preset ubuntu-gcc-ci --output-on-failure

      - name: Upload GCC CTest report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ubuntu-gcc-ctest
          path: build/ubuntu-gcc-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
