name: Ubuntu CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clang:
    name: Clang 23 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build and analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config python3
          scripts/install-llvm-23-ubuntu.sh
          scripts/install-linux-build-tools.sh
          clang++-23 --version
          cmake --version
          ninja --version

      - name: Install pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-ci

      - name: Build
        run: cmake --build --preset ubuntu-ci --parallel 1

      - name: Check clang-format
        run: scripts/check-format-ubuntu.sh

      - name: Run clang-tidy
        run: scripts/check-tidy-ubuntu.sh build/ubuntu-ci

      - name: Run CTest
        run: ctest --preset ubuntu-ci

      - name: Upload CTest report
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ubuntu-clang-ctest
          path: build/ubuntu-ci/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  gcc:
    name: GCC 13 / Ubuntu 24.04
    runs-on: ubuntu-24.04
    env:
      VCPKG_ROOT: ${{ github.workspace }}/.vcpkg
      VCPKG_MAX_CONCURRENCY: 2
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential git curl zip unzip tar zstd pkg-config python3
          scripts/install-linux-build-tools.sh
          g++-13 -dumpfullversion | grep -Fx '13.3.0'
          gcc-13 -dumpfullversion | grep -Fx '13.3.0'
          cmake --version | grep -F '4.5.0'
          ninja --version | grep -Fx '1.13.2'

      - name: Install pinned vcpkg
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          git -C "$VCPKG_ROOT" fetch --depth 1 origin 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          git -C "$VCPKG_ROOT" checkout --detach 0df93a05b9de080129e653ec4776d7e14a1b2e4f
          "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure
        run: cmake --preset ubuntu-gcc-ci

      - name: Verify GCC compile database
        run: |
          python3 - <<'PY'
          import json
          import pathlib
          import shlex
          import shutil
          import subprocess

          expected = pathlib.Path(shutil.which("g++-13")).resolve(strict=True)
          cache = pathlib.Path("build/ubuntu-gcc-ci/CMakeCache.txt").read_text()
          compiler_entry = next(
              line for line in cache.splitlines()
              if line.startswith("CMAKE_CXX_COMPILER:") and "=" in line
          )
          configured_name = compiler_entry.split("=", 1)[1]
          configured_path = pathlib.Path(configured_name)
          if not configured_path.is_absolute():
              configured_name = shutil.which(configured_name)
              assert configured_name, "CMake's selected compiler is not on PATH"
              configured_path = pathlib.Path(configured_name)
          configured = configured_path.resolve(strict=True)
          assert configured == expected, f"CMake selected {configured}, expected {expected}"
          version = subprocess.check_output(
              [str(expected), "-dumpfullversion"], text=True
          ).strip()
          assert version == "13.3.0", f"Unexpected compiler version: {version}"

          commands = json.loads(
              pathlib.Path("build/ubuntu-gcc-ci/compile_commands.json").read_text()
          )
          assert commands, "compile_commands.json contains no commands"
          for entry in commands:
              argv = entry.get("arguments") or shlex.split(entry["command"])
              actual_name = argv[0]
              actual_path = pathlib.Path(actual_name)
              if not actual_path.is_absolute():
                  actual_name = shutil.which(actual_name)
                  assert actual_name, f"Compile command compiler is not on PATH: {argv[0]}"
                  actual_path = pathlib.Path(actual_name)
              actual = actual_path.resolve(strict=True)
              assert actual == expected, f"Compile command uses {actual}, expected {expected}"
          PY

      - name: Build
        run: cmake --build --preset ubuntu-gcc-ci --parallel 1

      - name: Run CTest
        run: ctest --preset ubuntu-gcc-ci
